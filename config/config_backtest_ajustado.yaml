# ==========================================================
# CONFIG AJUSTADA PARA BACKTEST MÁS ROBUSTO Y COMPARABLE
# Objetivo:
# - aumentar n_test_points
# - aumentar n_trades
# - permitir que summary_best_runs.xlsx sí se genere
# - mantener runtime razonable
# ==========================================================

mt5:
  login: 68238343
  password: "Colombia123*"
  server: "RoboForex-Pro"
  path: "C:\\Program Files\\RoboForex - MetaTrader 5\\terminal64.exe"

strategy_profile:
  name: "balanced"

validation:
  mode: last_n
  n: 400
  test_size: 0.2

data:
  symbol: "EURUSD"
  timeframe: "M5"
  n_bars: 10000
  use_cache: false
  cache_expiry_hours: 1
  pip_size: 0.0001
  additional_symbols:
    - "GBPUSD"
    - "US500"

data_cleaning:
  handle_missing: "ffill"
  outlier_method: "iqr"
  outlier_threshold: 3.0
  handle_outliers: "cap"
  remove_duplicates: true
  validate_ohlc: true
  min_valid_ratio: 0.90

eda:
  enabled: false
  output_dir: "outputs/eda"
  price_col: "Close"
  plots:
    price_series: true
    returns_distribution: true
    qq_plot: true
    acf_pacf: true
    rolling_volatility: true
    seasonal_decomposition: true
  acf_lags: 40
  rolling_windows: [20, 60, 120]
  seasonal_period: 7

features:
  returns:
    enabled: true
    periods: [1, 2, 3, 4, 5, 10]

  technical_indicators:
    enabled: true
    indicators:
      - sma_20
      - sma_50
      - ema_12
      - ema_26
      - rsi_14
      - macd
      - bollinger_bands
      - atr_14
      - roc_6
      - tick_volume_roc_3
      - tick_volume_zscore_20
      - mfi_14
      - adx_14

  lag_features:
    enabled: true
    columns: ["Close", "Volume"]
    lags: [1, 2, 3, 5, 10]

# Para estabilizar primero el baseline, lo dejo apagado en esta corrida.
# Cuando ya tengas un summary_best_runs.xlsx consistente, lo puedes volver a activar.
unsupervised:
  enabled: false
  method: "kmeans"
  n_clusters: 3
  add_one_hot: true

models:
  - name: Momentum
    enabled: true
    param_grid:
      lookback: [1, 3]

  - name: ARIMA
    enabled: true
    param_grid:
      p: [1, 2]
      d: [0, 1]
      q: [0, 1]

  - name: PROPHET
    enabled: true
    param_grid:
      changepoint_prior_scale: [0.01, 0.05, 0.1]
      seasonality_prior_scale: [0.5, 1.0]
      seasonality_mode: ["additive"]
      yearly_seasonality: [false]
      weekly_seasonality: [true]
      daily_seasonality: [false]
      use_lagged_regressors: [true]

  - name: LSTM
    enabled: false
    param_grid:
      window: [50]
      learning_rate: [0.001]
      architecture: ["stacked_lstm"]
      n_layers: [1]
      units: [32]
      dropout: [0.2]
      epochs: [30]
      batch_size: [64]
      early_stopping_patience: [5]

  - name: RandomForestRegressor
    enabled: true
    param_grid:
      n_estimators: [100, 200]
      max_depth: [4, 6]
      min_samples_leaf: [5, 10]

  - name: HistGradientBoosting
    enabled: true
    param_grid:
      learning_rate: [0.02, 0.03, 0.05]
      max_depth: [4, 6]
      max_iter: [100, 200]
      min_samples_leaf: [10]

backtest:
  enabled: true
  initial_train: 2500
  step: 5
  # En este pipeline, horizon=1 significa "una prediccion por fila".
  # El horizonte economico real vive en el target:
  # ReturnFwd_2 = retorno desde t hasta t+2 velas de M5 (~10 min).
  horizon: 1
  target: "ReturnFwd_2"
  pip_size: 0.0001
  threshold_pips: 5
  plot_scale: "price"
  risk_free: 0.0
  periods_per_year: 72576   # M5 ≈ 12*24*252

  metrics:
    - mae
    - rmse
    - hit_rate
    - dm_stat
    - dm_pvalue
    - sharpe
    - sortino
    - calmar
    - max_drawdown
    - profit_factor
    - win_rate
    - payoff_ratio
    - consistency_ratio
    - avg_trade_return
    - n_test_points
    - n_trades

output:
  dir: "outputs"
  save_predictions: true
  save_models: true
  save_plots: false
  formats:
    - csv
    - excel

trading:
  min_pips_signal: 5.0
  enable_confidence_filter: true
  min_confidence: 0.60
  signal_confirmation:
    enabled: false
    require_momentum_alignment: true
    momentum_column: "ROC_6"
    momentum_buy_min: 0.0
    momentum_sell_max: 0.0
    require_volume_confirmation: false
    volume_column: "TickVolume_ZScore_20"
    volume_min_strength: 0.0
    require_regime_confirmation: false
    regime_column: "ADX_14"
    regime_min_strength: 20.0
  execute_best_model_only: true
  auto_execute_orders: true
  allow_multiple_positions: true
  magic_number: 202204
  order_comment_prefix: "MarkIII"
  order_deviation_points: 20
  report_lookback_days: 30

risk:
  risk_per_trade_pct: 0.01
  max_total_open_risk_pct: 0.03
  halt_on_daily_loss: true
  daily_loss_limit_pct: 0.03
  daily_loss_measure: "equity"
  pre_trade_risk_validation: true
  risk_validation_tolerance_pct: 0.05
  block_new_entries_without_sl: true
  sl_mode: "atr"
  fixed_sl_pips: 30.0
  atr_sl_multiplier: 1.2
  atr_sl_min_pips: 8.0
  atr_sl_max_pips: 20.0
  tp_rr_ratio: 1.2
  entry_mode: "close"
  atr_entry_mult: 0.0

logging:
  enabled: true
  level: "INFO"
  to_file: true
  file_path: "logs/trading.log"
  to_console: true

execution:
  mode: "backtest"
  parallel: false
  n_jobs: -1

# Scheduler:
# Formato cron de 5 campos:
#   minuto hora dia_del_mes mes dia_de_semana
# Ejemplos:
#   "0 7 * * 1"      = lunes 07:00
#   "5 * * * 1-5"    = lunes-viernes, al minuto 05 de cada hora
#   "*/5 * * * 1-5"  = lunes-viernes, cada 5 minutos
#   "2,17,32,47 * * * 1-5" = lunes-viernes, 4 veces por hora
# Nota:
# - Si defines *_interval_minutes, el scheduler usa intervalo y no cron.
# - Usa cron cuando quieras horarios exactos.
# - Usa interval_minutes cuando quieras "cada N minutos".
scheduler:
  # Si es false, el scheduler queda desactivado aunque existan valores abajo.
  enabled: true

  # Cron genérico de compatibilidad.
  # En este proyecto se recomienda dejarlo vacío y usar backtest_cron / production_cron / sync_trades_cron.
  cron:

  # Programa cada cuánto correr el backtest.
  # Úsalo si quieres un horario exacto, por ejemplo:
  # "0 7 * * 1" = todos los lunes a las 07:00.
  backtest_cron:

  # Programa cada cuánto correr production.
  # Úsalo si quieres un horario exacto de señales, por ejemplo:
  # "5 * * * 1-5" = lunes-viernes al minuto 05 de cada hora.
  production_cron:

  # Programa cada cuánto correr sync_trades.
  # Úsalo para reconciliar posiciones/deals y actualizar reportes.
  sync_trades_cron:

  # Intervalo simple para backtest, en minutos.
  # 2880 = 2 días.
  backtest_interval_minutes: 2880

  # Intervalo simple para production, en minutos.
  # Para M5, 5 = 1 vela.
  production_interval_minutes: 5

  # Intervalo simple para sync_trades, en minutos.
  # 1 = revisar cierres y protección cada minuto.
  sync_trades_interval_minutes: 1

  # Desfase inicial en segundos para evitar que sync_trades choque con production.
  # 30 = sync corre a los 30s del minuto, mientras production corre en el minuto.
  sync_trades_offset_seconds: 30

  # Zona horaria usada por el scheduler.
  timezone: "America/Bogota"

  # Archivo de log propio del scheduler.
  log_file: "logs/automation_scheduler.log"

  # Si es true, production y sync_trades se ejecutan usando config_optimizado.yaml.
  # Si es false, usan el mismo archivo pasado en --config.
  production_use_optimized_config: true
  # Active profile for M5 using simple intervals:
  # - backtest every 2880 minutes = every 2 days
  # - production every 5 minutes = every new M5 candle
  # - sync open/closed trades every 1 minute, shifted by 30 seconds

model_selection:
  primary_metric: "sharpe"
  primary_greater_is_better: true
  secondary_metric: "profit_factor"
  secondary_greater_is_better: true
  min_trades: 5
  min_test_points: 40
