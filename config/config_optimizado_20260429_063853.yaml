  login: 68238343
  password: Colombia123*
  server: RoboForex-Pro
  path: C:\Program Files\RoboForex - MetaTrader 5\terminal64.exe
validation:
  mode: last_n
  n: 250
  test_size: 0.2
data:
  symbol: EURUSD
  timeframe: M5
  n_bars: 3000
  use_cache: false
  cache_expiry_hours: 1
  pip_size: 0.0001
  additional_symbols:
  - GBPUSD
  - US500
data_cleaning:
  handle_missing: ffill
  outlier_method: iqr
  outlier_threshold: 3.0
  handle_outliers: cap
  remove_duplicates: true
  validate_ohlc: true
  min_valid_ratio: 0.9
eda:
  enabled: false
  output_dir: outputs/eda
  price_col: Close
  plots:
    price_series: true
    returns_distribution: true
    qq_plot: true
    acf_pacf: true
    rolling_volatility: true
    seasonal_decomposition: true
  acf_lags: 40
  rolling_windows:
  - 20
  - 60
  - 120
  seasonal_period: 7
features:
  returns:
    enabled: true
    periods:
    - 1
    - 5
    - 10
  technical_indicators:
    enabled: true
    indicators:
    - sma_20
    - sma_50
    - ema_12
    - ema_26
    - rsi_14
    - macd
    - bollinger_bands
    - atr_14
  lag_features:
    enabled: true
    columns:
    - Close
    - Volume
    lags:
    - 1
    - 2
    - 3
    - 5
    - 10
unsupervised:
  enabled: false
  method: kmeans
  n_clusters: 3
  add_one_hot: true
models:
- name: Momentum
  enabled: true
  params:
    lookback: 1.0
  is_best: false
- name: ARIMA
  enabled: true
  params:
    d: 1.0
    p: 1.0
    q: 0.0
  is_best: false
- name: PROPHET
  enabled: true
  params:
    changepoint_prior_scale: 0.01
    daily_seasonality: false
    seasonality_mode: additive
    seasonality_prior_scale: 1.0
    use_lagged_regressors: true
    weekly_seasonality: true
    yearly_seasonality: false
  is_best: true
- name: RandomForestRegressor
  enabled: true
  params:
    max_depth: 4.0
    min_samples_leaf: 10.0
    n_estimators: 50.0
  is_best: false
- name: HistGradientBoosting
  enabled: true
  params:
    max_depth: 4.0
    min_samples_leaf: 10.0
    learning_rate: 0.05
    max_iter: 100.0
  is_best: false
backtest:
  enabled: true
  initial_train: 1200
  step: 20
  horizon: 1
  target: ReturnFwd_1
  pip_size: 0.0001
  threshold_pips: 2
  plot_scale: price
  risk_free: 0.0
  periods_per_year: 72576
  metrics:
  - mae
  - rmse
  - hit_rate
  - dm_stat
  - dm_pvalue
  - sharpe
  - sortino
  - calmar
  - max_drawdown
  - profit_factor
  - win_rate
  - payoff_ratio
  - consistency_ratio
  - avg_trade_return
  - n_test_points
  - n_trades
output:
  dir: outputs
  save_predictions: true
  save_models: true
  save_plots: false
  formats:
  - csv
  - excel
trading:
  min_pips_signal: 2.0
  enable_confidence_filter: false
  min_confidence: 0.6
  execute_best_model_only: true
  auto_execute_orders: true
  allow_multiple_positions: true
  magic_number: 202204
  order_comment_prefix: MarkIII
  order_deviation_points: 20
  report_lookback_days: 30
risk:
  risk_per_trade_pct: 0.01
  max_total_open_risk_pct: 0.03
  block_new_entries_without_sl: true
  sl_mode: atr
  fixed_sl_pips: 30.0
  atr_sl_multiplier: 1.5
  atr_sl_min_pips: 10.0
  atr_sl_max_pips: 40.0
  tp_rr_ratio: 2.0
  entry_mode: atr_pullback
  atr_entry_mult: 0.5
logging:
  enabled: true
  level: INFO
  to_file: true
  file_path: logs/trading.log
  to_console: true
execution:
  mode: backtest
  parallel: false
  n_jobs: -1
scheduler:
  enabled: true
  cron: null
  backtest_cron: null
  production_cron: null
  sync_trades_cron: null
  backtest_interval_minutes: 2880
  production_interval_minutes: 5
  sync_trades_interval_minutes: 1
  timezone: America/Bogota
  log_file: logs/automation_scheduler.log
  production_use_optimized_config: true
model_selection:
  primary_metric: sharpe
  primary_greater_is_better: true
  secondary_metric: profit_factor
  secondary_greater_is_better: true
  min_trades: 5
  min_test_points: 40
