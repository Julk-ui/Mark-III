  move_sl_to: breakeven
  breakeven_buffer_pips: 0.0
  only_once_per_stage: true
  skip_if_no_tp: true
  progressive_grid_enabled: true
  progressive_grid_start_progress_to_tp: 0.20
  progressive_grid_step_progress_to_tp: 0.05
  progressive_grid_end_progress_to_tp: 0.90
  progressive_grid_partial_close_fraction: 0.15
  progressive_grid_break_even_progress_to_tp: 0.20
  max_stage_actions_per_cycle: 4
  full_close_when_partial_below_min_enabled: true
  full_close_when_partial_below_min_progress_to_tp: 0.95
  comment_prefix: TM
  break_even_stages:
  - name: progress_50_close_30
    trigger_progress_to_tp: 0.5
    partial_close_fraction: 0.3
    move_sl_to_break_even: true
  - name: progress_70_close_50
    trigger_progress_to_tp: 0.7
    partial_close_fraction: 0.5
    move_sl_to_break_even: false
  - name: progress_85_close_80
    trigger_progress_to_tp: 0.85
    partial_close_fraction: 0.8
    move_sl_to_break_even: false
runtime_monitor:
  enabled: true
  recent_trade_max_bars: 3
  min_bars_before_no_progress: 2
  min_progress_to_keep: 0.2
  min_profit_progress_to_manage: 0.0
  partial_profit_progress_min: 0.20
  protect_on_reversal: true
  protect_on_lateralization: true
  manage_on_opposite_signal: true
  opposite_signal_min_primary_confidence: 0.70
  opposite_signal_max_age_bars: 6
  opposite_signal_close_if_nonnegative: true
  opposite_signal_arm_exit_until_break_even: true
  opposite_signal_reduce_to_min_if_losing: false
  opposite_signal_prioritize_child_positions: true
  close_full_on_weakness: true
  full_close_profit_progress_min: 0.45
  full_close_on_reversal: true
  full_close_on_lateralization: true
  full_close_on_no_followthrough: true
  shock_reversal_enabled: true
  shock_reversal_roc_abs_min: 0.00045
  shock_reversal_range_vs_avg_min: 1.6
  shock_reversal_dirvol_abs_min: 0.75
  shock_reversal_close_location_abs_min: 0.55
  shock_reversal_progress_min: 0.05
  regime_column: ADX_14
  momentum_column: ROC_6
  lateralization_short_momentum_column: ROC_3
  lateralization_small_range_column: RangeVsAvg6
  directional_volume_column: DirectionalVolumeProxy_ZScore_20
  close_location_column: CloseLocationValue
  reversal_roc_abs_min: 0.00025
  lateralization_horizon_bars: 2
  lateralization_adx_max: 18.0
  lateralization_compact_adx_max: 24.0
  lateralization_roc_abs_max: 0.0001
  lateralization_short_roc_abs_max: 0.00008
  lateralization_dirvol_abs_max: 0.1
  lateralization_compact_dirvol_abs_max: 0.2
  lateralization_small_range_max: 0.85
  lateralization_close_location_center_abs_max: 0.35
  partial_close_fraction_on_weakness: 0.5
  comment_prefix: RTM
market_pause:
  enabled: true
  pause_production: true
  pause_sync_trades: true
  pause_runtime_monitor: true
  max_tick_staleness_seconds: 900
  require_positive_quotes: true
logging:
  enabled: true
  level: INFO
  to_file: true
  file_path: logs/trading.log
  to_console: true
execution:
  mode: backtest
  parallel: false
  n_jobs: -1
scheduler:
  enabled: true
  cron: null
  backtest_cron: null
  production_cron: null
  sync_trades_cron: null
  backtest_interval_minutes: 2880
  production_interval_minutes: 5
  sync_trades_interval_minutes: 1
  sync_trades_offset_seconds: 30
  timezone: America/Bogota
  log_file: logs/automation_scheduler.log
  production_use_optimized_config: true
model_selection:
  primary_metric: sharpe
  primary_greater_is_better: true
  secondary_metric: profit_factor
  secondary_greater_is_better: true
  min_trades: 30
  min_test_points: 80
  publish_requires_candidate_thresholds: true
decision_bundle:
  mode: hybrid_primary_plus_filter
  name: HYBRID__ARIMA__HistGradientBoostingClassifier
  primary_model:
    name: ARIMA
    params:
      d: 0.0
      p: 3.0
      q: 0.0
  filter_model:
    name: HistGradientBoostingClassifier
    params:
      learning_rate: 0.05
      max_depth: 8.0
      max_iter: 150.0
      min_samples_leaf: 10.0
  require_alignment: false
  filter_gate_mode: primary_only
  support_probability_threshold: null
  support_probability_margin: null
  support_score_min: 0.0
  contradiction_margin: 0.1
  rules:
    min_pips_signal: 2.8
    min_confidence: 0.46
    barrier_probability_threshold: 0.5
    barrier_probability_margin: 0.02
    barrier_pips: 5.0
    barrier_horizon_bars: 5
