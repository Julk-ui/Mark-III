# ==========================================================
# PERFIL AGGRESSIVE HYBRID V1.4 M5 | BACKTEST INTERMEDIO DIRECCIONAL R3 FAST
# Objetivo:
# - mantener el perfil intermedio
# - conservar ARIMA, pero con grilla pequeña
# - terminar en horas
# ==========================================================

mt5:
  login: 68238343
  password: "Colombia123*"
  server: "RoboForex-Pro"
  path: "C:\\Program Files\\RoboForex - MetaTrader 5\\terminal64.exe"

strategy_profile:
  name: "aggressive_hybrid_v1_4_mid_r3_4p6b_fast"

prediction_stack:
  mode: "hybrid_primary_plus_filter"
  primary_models:
    - ARIMA
    - Ridge
    - RandomForestRegressor
    - HistGradientBoosting
  filter_models:
    - RandomForestClassifier
    - HistGradientBoostingClassifier
    - LogisticRegressionClassifier
    - ExtraTreesClassifier
  require_alignment: true
  filter_gate_mode: "support_score"
  support_score_min: 0.08
  contradiction_margin: 0.10
  top_k_primary_for_bundle_eval: 2
  top_k_filter_for_bundle_eval: 2

validation:
  mode: last_n
  n: 400
  test_size: 0.2

data:
  symbol: "EURUSD"
  timeframe: "M5"
  n_bars: 4500
  use_cache: true
  cache_expiry_hours: 1
  runtime_use_cache: false
  runtime_cache_expiry_minutes: 5
  pip_size: 0.0001

data_cleaning:
  handle_missing: "ffill"
  outlier_method: "iqr"
  outlier_threshold: 3.0
  handle_outliers: "cap"
  remove_duplicates: true
  validate_ohlc: true
  min_valid_ratio: 0.90

eda:
  enabled: false
  output_dir: "outputs/eda"
  price_col: "Close"

features:
  returns:
    enabled: true
    periods: [1, 2, 3, 4, 5, 10]

  technical_indicators:
    enabled: true
    indicators:
      - sma_20
      - sma_50
      - ema_12
      - ema_26
      - rsi_14
      - macd
      - bollinger_bands
      - atr_14
      - roc_6
      - tick_volume_roc_3
      - tick_volume_zscore_20
      - directional_volume_proxy_zscore_20
      - mfi_14
      - adx_14

  lag_features:
    enabled: true
    columns: ["Close", "Volume"]
    lags: [1, 2, 3, 5, 10]

unsupervised:
  enabled: false

models:
  - name: Momentum
    enabled: true
    selection_role: baseline
    param_grid:
      lookback: [1]

  - name: ARIMA
    enabled: true
    stack_role: primary
    param_grid:
      p: [2, 4]
      d: [0]
      q: [0]

  - name: Ridge
    enabled: true
    stack_role: primary
    param_grid:
      alpha: [0.5, 2.0]

  - name: RandomForestRegressor
    enabled: true
    stack_role: primary
    param_grid:
      n_estimators: [200]
      max_depth: [4, 6]
      min_samples_leaf: [5]

  - name: HistGradientBoosting
    enabled: true
    stack_role: primary
    param_grid:
      learning_rate: [0.03]
      max_depth: [4, 6]
      max_iter: [100]
      min_samples_leaf: [10]

  - name: RandomForestClassifier
    enabled: true
    stack_role: filter
    param_grid:
      n_estimators: [200]
      max_depth: [4, 6]
      min_samples_leaf: [5]

  - name: HistGradientBoostingClassifier
    enabled: true
    stack_role: filter
    param_grid:
      learning_rate: [0.03]
      max_depth: [4, 6]
      max_iter: [150]
      min_samples_leaf: [10]

  - name: LogisticRegressionClassifier
    enabled: true
    stack_role: filter
    param_grid:
      C: [1.0]
      max_iter: [400]
      class_weight: [null]

  - name: ExtraTreesClassifier
    enabled: true
    stack_role: filter
    param_grid:
      n_estimators: [200]
      max_depth: [6]
      min_samples_leaf: [3]

backtest:
  enabled: true
  target_mode: "return_regression"
  target: "ReturnFwd_3"
  filter_target: "BarrierReturn_4p_6b"
  barrier_pips: 4
  barrier_horizon_bars: 6
  barrier_price_col: "Close"
  barrier_high_col: "High"
  barrier_low_col: "Low"
  initial_train: 1800
  step: 16
  horizon: 3
  audit_followthrough_bars: 8
  pip_size: 0.0001
  threshold_pips: 2.5
  plot_scale: "price_target"
  risk_free: 0.0
  periods_per_year: 72576
  metrics:
    - mae
    - rmse
    - hit_rate
    - dm_stat
    - dm_pvalue
    - sharpe
    - sortino
    - calmar
    - max_drawdown
    - profit_factor
    - win_rate
    - payoff_ratio
    - consistency_ratio
    - avg_trade_return
    - n_test_points
    - n_trades

output:
  dir: "outputs"
  save_predictions: false
  save_models: true
  save_plots: false
  formats:
    - csv

trading:
  min_pips_signal: 2.5
  enable_confidence_filter: true
  min_confidence: 0.48
  barrier_probability_threshold: 0.50
  barrier_probability_margin: 0.02
  signal_confirmation:
    enabled: false
  execute_best_model_only: true
  auto_execute_orders: true
  allow_multiple_positions: true
  magic_number: 202357
  order_comment_prefix: "MarkIII_AggH13B"
  order_deviation_points: 20
  report_lookback_days: 30

risk:
  risk_per_trade_pct: 0.01
  max_total_open_risk_pct: 0.03
  halt_on_daily_loss: false
  daily_loss_limit_pct: 0.0
  daily_loss_measure: "equity"
  pre_trade_risk_validation: true
  risk_validation_tolerance_pct: 0.05
  block_new_entries_without_sl: true
  sl_mode: "atr"
  fixed_sl_pips: 3.0
  atr_sl_multiplier: 1.20
  atr_sl_min_pips: 4.0
  atr_sl_max_pips: 11.0
  tp_rr_ratio: 1.6
  tp_use_predicted_move: true
  tp_min_pips: 0.0
  tp_max_pips: 15.0
  entry_mode: "close"
  atr_entry_mult: 0.0

execution:
  mode: "backtest"
  parallel: false
  n_jobs: -1

model_selection:
  primary_metric: directional_balance_score
  primary_greater_is_better: true
  secondary_metric: directional_pf_floor
  secondary_greater_is_better: true
  min_trades: 20
  min_test_points: 80
  publish_requires_candidate_thresholds: true
