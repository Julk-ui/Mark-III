  mode: "candidate_retrace"
  max_stage_bars: 2
  min_primary_confidence: 0.68
  min_abs_predicted_pips: 3.2
  allow_stage_on_filter_contradiction_alignment: true
  contradiction_stage_primary_confidence_min: 0.7
  contradiction_stage_predicted_pips_min: 3.5
  contradiction_stage_adx_min: 8.0
  contradiction_stage_roc_abs_min: 0.0006
  contradiction_stage_directional_volume_abs_min: 0.5
  contradiction_stage_retrace_fraction: 0.25
  contradiction_stage_max_stage_bars: 1
  contradiction_stage_breakout_partial_fraction: 0.0
  allow_stage_on_strong_primary_filter_hold: true
  strong_primary_hold_confidence_min: 0.9
  strong_primary_hold_predicted_pips_min: 6.0
  strong_primary_hold_adx_min: 25.0
  strong_primary_hold_roc_abs_min: 0.00035
  strong_primary_hold_retrace_fraction: 0.25
  strong_primary_hold_max_stage_bars: 1
  strong_primary_hold_breakout_partial_fraction: 0.2
  direct_confirmed_revalidate_on_activation: true
  direct_confirmed_cancel_if_primary_mismatch: true
  direct_confirmed_cancel_if_confidence_drops: true
  direct_confirmed_cancel_if_predicted_move_drops: true
  direct_confirmed_activation_confidence_min: 0.6
  direct_confirmed_activation_predicted_pips_min: 3.5
  pilot_entry_enabled: true
  pilot_confidence_min: 0.6
  pilot_fraction_of_full_size: 0.25
  pilot_allow_on_filter_contradiction: false
  pilot_convert_to_staged: true
  pilot_market_fallback_enabled: false
  pilot_retrace_fraction: 0.5
  pilot_allowed_profiles:
  - "strong_trend"
  - "normal_trend"
  pilot_revalidate_on_activation: true
  pilot_cancel_if_primary_mismatch: true
  pilot_cancel_if_filter_contradicted: true
  pilot_cancel_if_confidence_drops: true
  pilot_cancel_if_predicted_move_drops: true
  adaptive_profile_enabled: true
  adaptive_roc_column: "ROC_6"
  adaptive_adx_column: "ADX_14"
  adaptive_directional_volume_column: "DirectionalVolumeProxy_ZScore_20"
  strong_trend_adx_min: 35.0
  normal_trend_adx_min: 22.0
  strong_trend_roc_abs_min: 0.00045
  normal_trend_roc_abs_min: 0.0002
  strong_trend_volume_abs_min: 0.35
  normal_trend_volume_abs_min: 0.05
  strong_trend_retrace_fraction: 0.2
  normal_trend_retrace_fraction: 0.35
  weak_trend_retrace_fraction: 0.55
  strong_trend_max_stage_bars: 1
