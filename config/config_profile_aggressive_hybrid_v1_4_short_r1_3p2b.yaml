  retrace_trigger_fraction_of_stop: 0.35
  min_entry_improvement_pips: 0.8
  allow_breakout_if_filter_upgrades: true
  breakout_min_support_score: 0.08
  cancel_on_opposite_primary_signal: true
  cancel_on_filter_contradiction: true
  comment_prefix: "ES"

trade_management:
  enabled: true
  move_sl_to: "breakeven"
  breakeven_buffer_pips: 0.0
  only_once_per_stage: true
  skip_if_no_tp: true
  comment_prefix: "TM"
  break_even_stages:
    - name: "progress_50_close_30"
      trigger_progress_to_tp: 0.50
      partial_close_fraction: 0.30
      move_sl_to_break_even: true
    - name: "progress_70_close_50"
      trigger_progress_to_tp: 0.70
      partial_close_fraction: 0.50
      move_sl_to_break_even: false
    - name: "progress_85_close_80"
      trigger_progress_to_tp: 0.85
      partial_close_fraction: 0.80
      move_sl_to_break_even: false
runtime_monitor:
  enabled: true
  recent_trade_max_bars: 3
  min_bars_before_no_progress: 2
  min_progress_to_keep: 0.2
  min_profit_progress_to_manage: 0.0
  partial_profit_progress_min: 0.25
  protect_on_reversal: true
  protect_on_lateralization: true
  regime_column: "ADX_14"
  momentum_column: "ROC_6"
  directional_volume_column: "DirectionalVolumeProxy_ZScore_20"
  close_location_column: "CloseLocationValue"
  reversal_roc_abs_min: 0.00025
  lateralization_adx_max: 18.0
  lateralization_roc_abs_max: 0.00010
  lateralization_dirvol_abs_max: 0.10
  partial_close_fraction_on_weakness: 0.50
  comment_prefix: "RTM"

logging:
  enabled: true
  level: "INFO"
  to_file: true
  file_path: "logs/trading.log"
  to_console: true

execution:
  mode: "backtest"
  parallel: false
  n_jobs: -1

scheduler:
  enabled: true
  cron:
  backtest_cron:
  production_cron:
  sync_trades_cron:
  backtest_interval_minutes: 2880
  production_interval_minutes: 5
  sync_trades_interval_minutes: 1
  sync_trades_offset_seconds: 30
  timezone: "America/Bogota"
  log_file: "logs/automation_scheduler.log"
  production_use_optimized_config: true

model_selection:
  primary_metric: directional_balance_score
  primary_greater_is_better: true
  secondary_metric: directional_pf_floor
  secondary_greater_is_better: true
  min_trades: 40
  min_test_points: 120
  publish_requires_candidate_thresholds: true
