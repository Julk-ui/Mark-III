  dynamic_stop_min_pips: 5.0
  require_directional_volume_activation: false
  directional_volume_column: "DirectionalVolumeProxy_ZScore_20"
  directional_volume_buy_min: 0.1
  directional_volume_sell_max: -0.1
  allow_stage_on_filter_hold: true
  block_stage_on_filter_contradiction: true
