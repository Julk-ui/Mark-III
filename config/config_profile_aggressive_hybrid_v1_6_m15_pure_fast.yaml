mt5:
  login: 68238343
  password: Colombia123*
  server: RoboForex-Pro
  path: C:\Program Files\RoboForex - MetaTrader 5\terminal64.exe

strategy_profile:
  name: aggressive_hybrid_v1_6_m15_pure_fast

prediction_stack:
  mode: hybrid_primary_plus_filter
  primary_models:
    - ARIMA
    - Ridge
    - RandomForestRegressor
    - HistGradientBoosting
  filter_models:
    - RandomForestClassifier
    - HistGradientBoostingClassifier
    - LogisticRegressionClassifier
  require_alignment: false
  filter_gate_mode: primary_only
  support_score_min: 0.0
  contradiction_margin: 0.1
  top_k_primary_for_bundle_eval: 3
  top_k_filter_for_bundle_eval: 3

validation:
  mode: last_n
  n: 320
  test_size: 0.2

data:
  symbol: EURUSD
  timeframe: M15
  n_bars: 4000
  use_cache: true
  cache_expiry_hours: 1
  runtime_use_cache: false
  runtime_cache_expiry_minutes: 10
  pip_size: 0.0001

data_cleaning:
  handle_missing: ffill
  outlier_method: iqr
  outlier_threshold: 3.0
  handle_outliers: cap
  remove_duplicates: true
  validate_ohlc: true
  min_valid_ratio: 0.9

eda:
  enabled: false
  output_dir: outputs/eda
  price_col: Close

features:
  returns:
    enabled: true
    periods: [1, 2, 3, 4, 6, 8]
  technical_indicators:
    enabled: true
    indicators:
      - sma_20
      - sma_50
      - ema_12
      - ema_26
      - rsi_14
      - macd
      - bollinger_bands
      - atr_14
      - roc_3
      - roc_6
      - tick_volume_roc_3
      - tick_volume_zscore_20
      - close_location_value
      - directional_volume_proxy_zscore_20
      - mfi_14
      - adx_14
  price_action:
    enabled: true
    features:
      - break_above_prev_high
      - break_below_prev_low
      - break_above_recent_high_3
      - break_below_recent_low_3
      - break_above_recent_high_6
      - break_below_recent_low_6
      - structure_score_3
      - structure_score_6
      - range_vs_avg_6
  lag_features:
    enabled: true
    columns:
      - Close
      - Volume
    lags: [1, 2, 3, 4, 6]

unsupervised:
  enabled: false

models:
  - name: Momentum
    enabled: true
    param_grid:
      lookback: [1, 2]
    selection_role: baseline
    is_best: false
  - name: ARIMA
    enabled: true
    param_grid:
      p: [2, 3, 4]
      d: [0, 1]
      q: [0, 1]
    selection_role: candidate
    is_best: false
  - name: Ridge
    enabled: true
    param_grid:
      alpha: [0.5, 2.0]
    selection_role: candidate
    is_best: false
  - name: RandomForestRegressor
    enabled: true
    param_grid:
      n_estimators: [200]
      max_depth: [4, 6]
      min_samples_leaf: [5]
    selection_role: candidate
    is_best: false
  - name: HistGradientBoosting
    enabled: true
    param_grid:
      learning_rate: [0.05]
      max_depth: [4, 6]
      max_iter: [100]
      min_samples_leaf: [10]
    selection_role: candidate
    is_best: false
  - name: RandomForestClassifier
    enabled: true
    param_grid:
      n_estimators: [200]
      max_depth: [4, 6]
      min_samples_leaf: [5]
    selection_role: candidate
    is_best: false
  - name: HistGradientBoostingClassifier
    enabled: true
    param_grid:
      learning_rate: [0.05]
      max_depth: [4, 6]
      max_iter: [150]
      min_samples_leaf: [10]
    selection_role: candidate
    is_best: false
  - name: LogisticRegressionClassifier
    enabled: true
    param_grid:
      C: [1.0]
      max_iter: [400]
      class_weight: [null]
    selection_role: candidate
    is_best: false

backtest:
  enabled: true
  target_mode: return_regression
  target: ReturnFwd_1
  filter_target: BarrierReturn_6p_2b
  barrier_pips: 6
  barrier_horizon_bars: 2
  barrier_price_col: Close
  barrier_high_col: High
  barrier_low_col: Low
  initial_train: 1400
  step: 4
  horizon: 1
  audit_followthrough_bars: 4
  pip_size: 0.0001
  threshold_pips: 2.5
  plot_scale: price_target
  risk_free: 0.0
  periods_per_year: 24192
  metrics:
    - mae
    - rmse
    - hit_rate
    - dm_stat
    - dm_pvalue
    - sharpe
    - sortino
    - calmar
    - max_drawdown
    - profit_factor
    - win_rate
    - payoff_ratio
    - consistency_ratio
    - avg_trade_return
    - n_test_points
    - n_trades

output:
  dir: outputs
  save_predictions: false
  save_models: true
  save_plots: false
  formats:
    - csv

trading:
  min_pips_signal: 2.5
  enable_confidence_filter: true
  min_confidence: 0.48
  barrier_probability_threshold: 0.5
  barrier_probability_margin: 0.02
  signal_confirmation:
    enabled: false
  execute_best_model_only: true
  auto_execute_orders: false
  allow_multiple_positions: true
  magic_number: 202363
  order_comment_prefix: MarkIII_M15Pure
  order_deviation_points: 20
  report_lookback_days: 30

risk:
  risk_per_trade_pct: 0.01
  max_total_open_risk_pct: 0.03
  halt_on_daily_loss: false
  daily_loss_limit_pct: 0.0
  daily_loss_measure: equity
  pre_trade_risk_validation: true
  risk_validation_tolerance_pct: 0.05
  block_new_entries_without_sl: true
  sl_mode: atr
  fixed_sl_pips: 4.0
  atr_sl_multiplier: 1.2
  atr_sl_min_pips: 4.0
  atr_sl_max_pips: 18.0
  tp_rr_ratio: 1.5
  tp_use_predicted_move: true
  tp_min_pips: 0.0
  tp_max_pips: 20.0
  entry_mode: close
  atr_entry_mult: 0.0

entry_management:
  enabled: true
  mode: split_retrace_limit
  initial_market_fraction: 0.6
  pending_fraction: 0.4
  retrace_fraction_of_stop: 0.3
  pending_order_type: limit
  cancel_pending_after_bars: 2
  cancel_pending_on_position_close: true
  disable_pending_when_filter_hold: false
  comment_prefix: EM

entry_staging:
  enabled: true
  mode: candidate_retrace
  max_stage_bars: 1
  min_primary_confidence: 0.6
  min_abs_predicted_pips: 2.5
  allow_stage_on_filter_contradiction_alignment: true
  contradiction_stage_primary_confidence_min: 0.72
  contradiction_stage_predicted_pips_min: 3.5
  contradiction_stage_adx_min: 12.0
  contradiction_stage_roc_abs_min: 0.00015
  contradiction_stage_directional_volume_abs_min: 0.15
  contradiction_stage_retrace_fraction: 0.2
  contradiction_stage_max_stage_bars: 1
  contradiction_stage_breakout_partial_fraction: 0.0
  allow_stage_on_early_structural_reversal: true
  early_reversal_confidence_min: 0.68
  early_reversal_predicted_pips_min: 3.0
  early_reversal_short_roc_abs_min: 0.0001
  early_reversal_adx_min: 16.0
  early_reversal_directional_volume_abs_min: 0.1
  early_reversal_structure_score_abs_min: 0.15
  allow_stage_on_filter_lead_structural: true
  filter_lead_structural_filter_confidence_min: 0.5
  filter_lead_structural_primary_hold_confidence_min: 0.45
  filter_lead_structural_predicted_pips_floor: 2.5
  filter_lead_structural_short_roc_abs_min: 0.0001
  filter_lead_structural_adx_min: 14.0
  filter_lead_structural_directional_volume_abs_min: 0.05
  filter_lead_structural_structure_score_abs_min: 0.15

execution:
  mode: backtest
  parallel: false
  n_jobs: -1

model_selection:
  primary_metric: directional_balance_score
  primary_greater_is_better: true
  secondary_metric: directional_pf_floor
  secondary_greater_is_better: true
  min_trades: 20
  min_test_points: 80
  publish_requires_candidate_thresholds: true
