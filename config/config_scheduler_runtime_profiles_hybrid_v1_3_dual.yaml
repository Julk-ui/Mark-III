# ==========================================================
# SCHEDULER DUAL PARA aggressive_hybrid_v1_3_tp4_sl2_5
# y aggressive_hybrid_v1_3_tp5_sl3
#
# Nota:
# - ambos perfiles usan magic_number distinto, por lo que MT5 puede
#   distinguir sus ordenes/posiciones.
# - sync_trades sigue usando una sola config base; se eligio la de
#   tp5_sl3 porque comparte la misma logica de trade management que tp4.
# - pensado para correr ambos perfiles en paralelo con pequeno desfase.
# ==========================================================

scheduler:
  enabled: true

  cron:
  backtest_cron:
  production_cron:
  sync_trades_cron:

  backtest_interval_minutes:
  production_interval_minutes: 5
  sync_trades_interval_minutes: 1

  production_profiles:
    - aggressive_hybrid_v1_3_tp4_sl2_5
    - aggressive_hybrid_v1_3_tp5_sl3

  sync_trades_profile: aggressive_hybrid_v1_3_tp5_sl3

  production_profile_spacing_seconds: 35
  sync_trades_offset_seconds: 45

  timezone: "America/Bogota"
  log_file: "logs/automation_scheduler.log"
  production_use_optimized_config: true
