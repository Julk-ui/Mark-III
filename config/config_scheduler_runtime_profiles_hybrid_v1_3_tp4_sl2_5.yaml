# ==========================================================
# SCHEDULER OPERATIVO PARA aggressive_hybrid_v1_3_tp4_sl2_5
# Uso:
# - correr production + sync_trades con la ultima release activa
#   del perfil aggressive_hybrid_v1_3_tp4_sl2_5
# - pensado para operar el bundle hibrido publicado sin mezclarlo
#   con schedulers anteriores
# ==========================================================

scheduler:
  enabled: true

  cron:
  backtest_cron:
  production_cron:
  sync_trades_cron:

  backtest_interval_minutes:
  production_interval_minutes: 5
  sync_trades_interval_minutes: 1

  production_profiles:
    - aggressive_hybrid_v1_3_tp4_sl2_5

  sync_trades_profile: aggressive_hybrid_v1_3_tp4_sl2_5

  production_profile_spacing_seconds: 25
  sync_trades_offset_seconds: 45

  timezone: "America/Bogota"
  log_file: "logs/automation_scheduler.log"
  production_use_optimized_config: true
