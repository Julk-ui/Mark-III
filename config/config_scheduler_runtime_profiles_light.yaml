# ==========================================================
# SCHEDULER OPERATIVO PARA PERFILES LIGHT
# Uso:
# - correr production + sync_trades con perfiles ligeros
# - ideal mientras los backtests completos corren aparte
# - no dispara backtests automaticos
#
# Comando recomendado:
#   python scheduler_automation.py --config config/config_scheduler_runtime_profiles_light.yaml
#
# Nota importante:
# - cada perfil light debe haber publicado al menos una release activa:
#   active_release_aggressive_light.json
#   active_release_balanced_light.json
#   active_release_conservative_light.json
# - si falta la release activa de un perfil, ese perfil no podra operar
# ==========================================================

scheduler:
  enabled: true

  cron:
  backtest_cron:
  production_cron:
  sync_trades_cron:

  backtest_interval_minutes:
  production_interval_minutes: 5
  sync_trades_interval_minutes: 1

  # Perfiles light habilitados para produccion.
  # Puedes dejar uno, dos o los tres.
  production_profiles:
    - balanced_light

  # Perfil base para sync_trades.
  # Se usa para resolver la config optimizada activa del runtime operativo.
  sync_trades_profile: balanced_light

  # Separa el lanzamiento entre perfiles para no competir por lock o CPU
  # exactamente en el mismo segundo.
  production_profile_spacing_seconds: 25

  # Desfase para que sync_trades no choque con production.
  sync_trades_offset_seconds: 45

  timezone: "America/Bogota"
  log_file: "logs/automation_scheduler.log"
  production_use_optimized_config: true
